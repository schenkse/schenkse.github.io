<title>Schenk Site Directions</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;900&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Chivo+Mono:wght@400;600&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;700;800&family=Karla:ital,wght@0,400;0,600;0,700;1,400&family=Source+Sans+3:wght@400;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap"
/>

<style>
  /* ---- Review chrome -------------------------------------------------
     Deliberately quiet: the mockups are the loud part. Neutral grey with a
     faint violet bias, mono for labels, no decoration that competes. */
  :root {
    --c-bg: #eeeef1;
    --c-panel: #ffffff;
    --c-ink: #15151c;
    --c-mute: #6b6b78;
    --c-line: #d9d9e1;
    --c-line-soft: #e6e6ec;
    --c-accent: #3b3556;
    --c-shadow: 0 1px 2px rgba(20, 20, 32, 0.06), 0 14px 34px rgba(20, 20, 32, 0.09);
  }
  :root:not([data-theme="light"]) {
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --c-bg: #121218;
      --c-panel: #1b1b23;
      --c-ink: #ecebf2;
      --c-mute: #90909f;
      --c-line: #2e2e3a;
      --c-line-soft: #26262f;
      --c-accent: #cfc9ef;
      --c-shadow: 0 1px 2px rgba(0, 0, 0, 0.5), 0 14px 34px rgba(0, 0, 0, 0.4);
    }
  }
  :root[data-theme="dark"] {
    --c-bg: #121218;
    --c-panel: #1b1b23;
    --c-ink: #ecebf2;
    --c-mute: #90909f;
    --c-line: #2e2e3a;
    --c-line-soft: #26262f;
    --c-accent: #cfc9ef;
    --c-shadow: 0 1px 2px rgba(0, 0, 0, 0.5), 0 14px 34px rgba(0, 0, 0, 0.4);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--c-bg);
    color: var(--c-ink);
    font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
    font-size: 15px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }

  .wrap { padding-block: 22px 40px; padding-left: 20px; padding-right: 20px; }

  /* ---- Toolbar ---- */
  .bar {
    position: sticky;
    top: 0;
    z-index: 20;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 14px 18px;
    padding: 12px 20px;
    background: color-mix(in srgb, var(--c-bg) 88%, transparent);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--c-line);
  }
  .bar__id { display: flex; flex-direction: column; margin-right: auto; }
  .bar__title { font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
  .bar__sub {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 11.5px;
    color: var(--c-mute);
  }

  .seg {
    display: flex;
    align-items: stretch;
    border: 1px solid var(--c-line);
    border-radius: 7px;
    background: var(--c-panel);
    overflow: hidden;
  }
  .seg button {
    appearance: none;
    border: 0;
    border-left: 1px solid var(--c-line-soft);
    background: transparent;
    color: var(--c-mute);
    font: inherit;
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 12px;
    padding: 6px 11px;
    cursor: pointer;
    transition: background 120ms ease, color 120ms ease;
  }
  .seg button:first-child { border-left: 0; }
  .seg button:hover { color: var(--c-ink); background: var(--c-line-soft); }
  .seg button[aria-pressed="true"] {
    background: var(--c-accent);
    color: var(--c-panel);
  }
  .seg button:focus-visible { outline: 2px solid var(--c-accent); outline-offset: -2px; }

  .bar__label {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 11px;
    color: var(--c-mute);
    margin-right: -10px;
  }

  /* ---- Rail of mockups ---- */
  .rail {
    display: flex;
    gap: 22px;
    align-items: start;
    overflow-x: auto;
    padding-bottom: 14px;
    scroll-snap-type: x proximity;
  }
  .slot {
    flex: 0 0 auto;
    width: clamp(330px, 31vw, 470px);
    scroll-snap-align: start;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .slot__head { display: flex; gap: 11px; align-items: baseline; }
  .slot__letter {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 13px;
    font-weight: 600;
    width: 26px;
    height: 26px;
    flex: 0 0 26px;
    display: grid;
    place-items: center;
    border-radius: 6px;
    background: var(--c-accent);
    color: var(--c-panel);
    align-self: center;
  }
  .slot__name { font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
  .slot__blurb { font-size: 12.5px; color: var(--c-mute); line-height: 1.45; }

  .frame {
    position: relative;
    height: min(74vh, 840px);
    overflow: auto;
    overscroll-behavior: contain;
    border: 1px solid var(--c-line);
    border-radius: 12px;
    background: var(--c-panel);
    box-shadow: var(--c-shadow);
  }
  .stage { width: 1240px; }

  .notes { display: none; }

  /* ---- Focus mode ---- */
  body[data-view="focus"] .rail { display: block; overflow: visible; }
  body[data-view="focus"] .slot { width: 100%; max-width: 1240px; margin: 0 auto; }
  body[data-view="focus"] .slot[hidden] { display: none; }
  body[data-view="focus"] .frame { height: calc(100vh - 190px); }
  body[data-view="focus"] .notes {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
    gap: 2px;
    border: 1px solid var(--c-line);
    border-radius: 10px;
    overflow: hidden;
    background: var(--c-line-soft);
  }
  .note { background: var(--c-panel); padding: 10px 13px; }
  .note dt {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 10.5px;
    letter-spacing: 0.06em;
    color: var(--c-mute);
    margin-bottom: 2px;
  }
  .note dd { margin: 0; font-size: 13px; }

  .hint {
    margin: 0 0 14px;
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 11.5px;
    color: var(--c-mute);
  }

  @media (max-width: 720px) {
    .slot { width: 84vw; }
    .bar { gap: 10px 12px; }
    .bar__id { flex: 1 0 100%; margin-right: 0; }
  }
</style>

<div class="bar">
  <div class="bar__id">
    <span class="bar__title">Five directions for schenkse.github.io</span>
    <span class="bar__sub">same content, five visual languages — A is closest to today, E is furthest</span>
  </div>

  <span class="bar__label">view</span>
  <div class="seg" id="view-seg">
    <button type="button" data-view="rail" aria-pressed="true">All five</button>
    <button type="button" data-view="focus" aria-pressed="false">Focus</button>
  </div>

  <span class="bar__label">design</span>
  <div class="seg" id="pick-seg"></div>

  <span class="bar__label">theme</span>
  <div class="seg" id="theme-seg">
    <button type="button" data-t="light" aria-pressed="true">Light</button>
    <button type="button" data-t="dark" aria-pressed="false">Dark</button>
  </div>
</div>

<div class="wrap">
  <p class="hint" id="hint">Each panel scrolls on its own. Pick a letter to blow it up full size.</p>
  <div class="rail" id="rail"></div>
</div>

<script>
  /* =====================================================================
     Every mockup is rendered into its own shadow root, so the five CSS
     systems can use the same class names without colliding. Content lives
     once in DATA and is shared by all five, so what differs between them
     is purely design.
     ===================================================================== */

  const DATA = {
    name: "Sebastian Schenk",
    role: "Theoretical physicist",
    place: "Karlsruhe Institute of Technology",
    tagline: "Reverse-engineering nature, approximately.",
    intro:
      "I work on quantum field theory and its less tractable corners — instantons, resurgence, tunnelling. Lately I'm bringing the same taste for hard problems and clean abstractions over to quantum information technology.",
    bio: [
      "My research lives in some challenging corners of quantum theory: instantons and other nonperturbative effects, semiclassical descriptions, quantum tunnelling. In short, the calculations that keep the path integral interesting.",
      "Almost any topic in high energy physics can catch my attention, especially the problems where careful thinking pays off. That curiosity doesn't stop at physics — I'm just as happy tinkering with new technology and learning across disciplines.",
    ],
    timeline: [
      { from: 2025, to: null, span: "2025 — now", role: "Postdoctoral Researcher", place: "Karlsruhe Institute of Technology, DE" },
      { from: 2022, to: 2025, span: "2022 — 2025", role: "Postdoctoral Researcher", place: "Mainz University, DE" },
      { from: 2019, to: 2022, span: "2019 — 2022", role: "Walter Benjamin Fellow", place: "Durham University, UK" },
      { from: 2016, to: 2019, span: "2016 — 2019", role: "PhD, Theoretical Physics", place: "Heidelberg University, DE" },
    ],
    pubTotal: 17,
    pubs: [
      {
        year: 2025,
        title: "Signatures of High-Frequency Gravitational Waves in Electromagnetic Cavities",
        authors: "S. Schenk, K. Schmieden, P. Schwaller",
        venue: "preprint",
        arxiv: "2512.20592",
      },
      {
        year: 2025,
        title: "Exploring Nonperturbative Behaviour of Moments and Cumulants in Quantum Theories",
        authors: "S. Schenk",
        venue: "Phys. Rev. D 112, 096018",
        arxiv: "2506.10188",
      },
      {
        year: 2024,
        title: "A Coordinate-Independent Formalism for Detecting High-Frequency Gravitational Waves",
        authors: "W. Ratzinger, S. Schenk, P. Schwaller",
        venue: "JHEP 08 (2024) 195",
        arxiv: "2404.08572",
      },
      {
        year: 2023,
        title: "Quantum Imprint of the Anharmonic Oscillator",
        authors: "P. Lo Chiatto, S. Schenk, F. Yu",
        venue: "preprint",
        arxiv: "2308.01244",
      },
      {
        year: 2023,
        title: "Charting the Free Energy Landscape of Metastable Topological Magnetic Objects",
        authors: "J. C. Criado, P. D. Hatton, Á. Lanza, S. Schenk, M. Spannowsky",
        venue: "Phys. Rev. B 109, 195114",
        arxiv: "2303.04099",
      },
      {
        year: 2022,
        title: "Multiparticle Amplitudes in a Scalar EFT",
        authors: "V. V. Khoze, S. Schenk",
        venue: "JHEP 05 (2022) 134",
        arxiv: "2203.03654",
      },
    ],
    projects: [
      { name: "Resurgence.jl", desc: "Resummation of divergent asymptotic series, in pure Julia.", lang: "Julia", year: 2026 },
      { name: "peerreview", desc: "Co-authorship networks for any researcher indexed on INSPIRE-HEP.", lang: "TypeScript", year: 2026 },
      { name: "BenderWu.jl", desc: "The Bender–Wu method for perturbative expansions, as a Julia package.", lang: "Julia", year: 2026 },
      { name: "preprint-numbers", desc: "A small Flask service that hands out sequential preprint IDs.", lang: "Python", year: 2025 },
      { name: "conway-gol", desc: "Conway's Game of Life, written in an afternoon.", lang: "JavaScript", year: 2025 },
    ],
    skills: [
      { group: "Research", items: ["Quantum field theory", "Nonperturbative methods", "Resurgence", "Light dark matter", "Skyrmions in chiral magnets"] },
      { group: "Languages and tools", items: ["Python", "Julia", "TypeScript", "Wolfram", "Tensor networks"] },
      { group: "Scientific computing", items: ["NumPy", "SciPy", "JAX", "Mathematica", "CUDA", "Qiskit", "ITensors"] },
      { group: "Currently learning", items: ["Agentic workflows for research", "Topological edge states"] },
    ],
    links: [
      { label: "Email", kind: "email", href: "#" },
      { label: "Matrix", kind: "matrix", href: "#" },
      { label: "GitHub", kind: "github", href: "https://github.com/schenkse" },
      { label: "INSPIRE-HEP", kind: "inspire", href: "https://inspirehep.net/authors/1706735" },
      { label: "ORCID", kind: "orcid", href: "https://orcid.org/0000-0002-9143-8870" },
    ],
    nav: ["About", "Publications", "Code", "Interests", "Contact"],
  };

  /* Bolds the site owner inside an author string, the way a CV does. */
  const me = (authors) => authors.replace(/S\. Schenk/g, "<b>S. Schenk</b>");
  const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");

  /* Shared sun/moon glyphs so every mockup can carry a real theme toggle. */
  const SUN = '<svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><circle cx="12" cy="12" r="4.4" fill="currentColor"/><g stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M12 2v2.6M12 19.4V22M2 12h2.6M19.4 12H22M4.9 4.9l1.9 1.9M17.2 17.2l1.9 1.9M4.9 19.1l1.9-1.9M17.2 6.8l1.9-1.9"/></g></svg>';
  const MOON = '<svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" fill="currentColor"/></svg>';

  const VARIANTS = [];

  /* =====================================================================
     A — Considered default
     The site you have, designed properly: same violet, same reading order,
     but the dotted eyebrows, the blob canvas and the card-for-everything
     habit are gone. Publications become a ruled index instead of cards.
     ===================================================================== */
  VARIANTS.push({
    letter: "A",
    name: "Considered default",
    blurb: "Your current structure and violet, with the generic tells removed and a real type pairing.",
    notes: {
      Typography: "Bricolage Grotesque for headings, Source Sans 3 for text",
      Palette: "the violet you already use, on a violet-biased neutral",
      "Bold move": "none — this one is deliberately safe",
      Risk: "low; closest to a straight upgrade of what's live",
    },
    css: `
      :host {
        --bg: #f7f6fb; --panel: #ffffff; --ink: #171327; --mute: #625d75;
        --line: #e7e4f0; --accent: #5b3df5; --soft: rgba(91, 61, 245, 0.08);
        --on-accent: #ffffff;
        display: block; background: var(--bg); color: var(--ink);
        font-family: "Source Sans 3", ui-sans-serif, system-ui, sans-serif;
        font-size: 17px; line-height: 1.65;
      }
      :host([data-t="dark"]) {
        --bg: #100e1a; --panel: #191628; --ink: #edeaf6; --mute: #9b94b0;
        --line: #2a2540; --accent: #a78bfa; --soft: rgba(167, 139, 250, 0.13);
        --on-accent: #100e1a;
      }
      * { box-sizing: border-box; }
      a { color: inherit; text-decoration: none; }
      h1, h2, h3 { font-family: "Bricolage Grotesque", ui-sans-serif, system-ui, sans-serif; margin: 0; letter-spacing: -0.03em; text-wrap: balance; }
      .wrap { max-width: 1000px; margin: 0 auto; padding-inline: 40px; }

      .top { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 90%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
      .top__in { display: flex; align-items: center; gap: 28px; height: 66px; }
      .mark { font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; font-size: 17px; letter-spacing: -0.03em; margin-right: auto; }
      .nav { display: flex; gap: 4px; }
      .nav a { font-size: 14.5px; color: var(--mute); padding: 6px 11px; border-radius: 7px; }
      .nav a:hover { color: var(--ink); background: var(--soft); }
      .nav a.on { color: var(--accent); background: var(--soft); }
      .tt { display: grid; place-items: center; width: 34px; height: 34px; border: 1px solid var(--line); border-radius: 9px; background: var(--panel); color: var(--mute); cursor: pointer; }
      .tt:hover { color: var(--accent); border-color: var(--accent); }

      .hero { display: grid; grid-template-columns: 1.3fr 0.7fr; gap: 56px; align-items: center; padding-block: 76px 84px; }
      .hero h1 { font-size: 62px; font-weight: 800; line-height: 1.02; }
      .hero .role { font-size: 21px; color: var(--accent); font-weight: 600; margin: 14px 0 0; }
      .hero .tag { font-size: 21px; color: var(--mute); margin: 0; }
      .hero p.intro { margin: 22px 0 0; max-width: 46ch; color: var(--mute); }
      .cta { display: flex; gap: 12px; margin-top: 30px; }
      .btn { font-size: 15px; font-weight: 600; padding: 10px 20px; border-radius: 10px; border: 1px solid var(--accent); }
      .btn--fill { background: var(--accent); color: var(--on-accent); }
      .btn--line { color: var(--accent); }
      .portrait { position: relative; justify-self: end; }
      .portrait img { width: 230px; height: 230px; object-fit: cover; border-radius: 14px; position: relative; z-index: 1; display: block; }
      .portrait::after { content: ""; position: absolute; inset: 16px -16px -16px 16px; border: 1.5px solid var(--accent); border-radius: 14px; }

      .sec { padding-block: 54px; border-top: 1px solid var(--line); }
      .sec__head { display: flex; align-items: baseline; gap: 18px; margin-bottom: 30px; }
      .sec__head h2 { font-size: 32px; font-weight: 700; }
      .sec__head .meta { margin-left: auto; font-size: 13.5px; color: var(--mute); }

      .about { display: grid; grid-template-columns: 1.15fr 0.85fr; gap: 54px; }
      .about p { margin: 0 0 16px; max-width: 58ch; }
      .tl { list-style: none; margin: 0; padding: 0 0 0 22px; border-left: 1px solid var(--line); display: grid; gap: 24px; }
      .tl li { position: relative; }
      .tl li::before { content: ""; position: absolute; left: -27px; top: 9px; width: 9px; height: 9px; border-radius: 50%; background: var(--line); }
      .tl li:first-child::before { background: var(--accent); }
      .tl .yr { display: block; font-size: 13px; color: var(--accent); font-weight: 600; font-variant-numeric: tabular-nums; }
      .tl .rl { display: block; font-weight: 600; font-size: 16px; }
      .tl .pl { display: block; font-size: 14.5px; color: var(--mute); }

      .filters { display: flex; gap: 8px; margin-bottom: 8px; }
      .fbtn { font: inherit; font-size: 14px; padding: 6px 15px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--mute); cursor: pointer; }
      .fbtn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }

      .pubs { list-style: none; margin: 0; padding: 0; }
      .pubs li { display: grid; grid-template-columns: 62px 1fr; gap: 20px; padding: 18px 14px; margin-inline: -14px; border-radius: 10px; border-bottom: 1px solid var(--line); }
      .pubs li:hover { background: var(--soft); }
      .pubs .yr { font-variant-numeric: tabular-nums; color: var(--mute); font-size: 15px; padding-top: 2px; }
      .pubs .ti { font-weight: 600; font-size: 17.5px; line-height: 1.35; letter-spacing: -0.005em; }
      .pubs li:hover .ti { color: var(--accent); }
      .pubs .au { font-size: 14.5px; color: var(--mute); margin-top: 3px; }
      .pubs .au b { color: var(--ink); font-weight: 600; }
      .pubs .vn { font-size: 14px; color: var(--mute); font-style: italic; margin-top: 2px; }
      .pubs .ax { font-size: 13px; color: var(--accent); font-weight: 600; }
      .is-out { display: none !important; }

      .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
      .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 22px; }
      .card h3 { font-size: 18px; font-weight: 700; }
      .card p { margin: 7px 0 14px; font-size: 15px; color: var(--mute); }
      .tag { font-size: 12.5px; color: var(--mute); border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; }

      .skl { display: grid; gap: 18px; }
      .skl__row { display: grid; grid-template-columns: 190px 1fr; gap: 20px; align-items: baseline; }
      .skl__row > span { font-weight: 600; font-size: 15px; }
      .chips { display: flex; flex-wrap: wrap; gap: 8px; }
      .chip { font-size: 14px; color: var(--mute); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 4px 11px; }

      .contact { display: flex; flex-wrap: wrap; gap: 10px; }
      .contact a { display: inline-flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600; padding: 11px 18px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); }
      .contact a:hover { border-color: var(--accent); color: var(--accent); }

      .foot { border-top: 1px solid var(--line); padding-block: 26px 40px; display: flex; font-size: 13.5px; color: var(--mute); }
      .foot span:last-child { margin-left: auto; }
    `,
    html: () => `
      <header class="top"><div class="wrap top__in">
        <span class="mark">Sebastian Schenk</span>
        <nav class="nav">${DATA.nav.map((n, i) => `<a href="#" class="${i === 1 ? "on" : ""}">${n}</a>`).join("")}</nav>
        <button class="tt" data-theme-toggle aria-label="Toggle theme">${SUN}</button>
      </div></header>

      <div class="wrap">
        <section class="hero">
          <div>
            <h1>${DATA.name}</h1>
            <p class="role">${DATA.role}</p>
            <p class="tag">${DATA.tagline}</p>
            <p class="intro">${DATA.intro}</p>
            <div class="cta"><a class="btn btn--fill" href="#">Read the papers</a><a class="btn btn--line" href="#">Get in touch</a></div>
          </div>
          <div class="portrait"><img src="me.jpeg" alt="Sebastian Schenk" /></div>
        </section>

        <section class="sec">
          <div class="sec__head"><h2>About</h2></div>
          <div class="about">
            <div>${DATA.bio.map((p) => `<p>${p}</p>`).join("")}</div>
            <ol class="tl">${DATA.timeline.map((t) => `<li><span class="yr">${t.span}</span><span class="rl">${t.role}</span><span class="pl">${t.place}</span></li>`).join("")}</ol>
          </div>
        </section>

      const g = 0.08, N = 22;
      const sums = [];
      let term = 1, acc = 0;
      for (let n = 0; n <= N; n++) {
        if (n > 0) term *= -n * g;
        acc += term;
        sums.push(acc);

      for (let t = 0; t < 60; t += 0.002) exact += (Math.exp(-t) / (1 + g * t)) * 0.002;

      });
    },

      .hello { display: grid; grid-template-columns: 1fr 1fr; gap: 56px; align-items: start; }
      .hello h2 { font-size: 72px; font-weight: 900; letter-spacing: -0.045em; line-height: 0.9; margin: 0; }
      .hello h2 span { color: var(--a2); }
      .cl { display: grid; }
      .cl a { display: grid; grid-template-columns: 1fr auto; gap: 16px; padding: 15px 0; border-top: 1px solid var(--line); font-family: "Chivo Mono", monospace; font-size: 13px; }
      .cl a:last-child { border-bottom: 1px solid var(--line); }
      .cl a:hover { color: var(--a1); }
      .cl a span:last-child { color: var(--mute); }

      .foot { padding-block: 24px 42px; display: flex; font-family: "Chivo Mono", monospace; font-size: 10.5px; letter-spacing: 0.06em; color: var(--mute); }
      .foot span:last-child { margin-left: auto; }
    `,
    html: () => `
      <section class="hero">

          <button class="tt" data-theme-toggle aria-label="Toggle theme">${SUN}</button>

      <div class="wrap">

          <div class="filters" data-filter-group>

          <ol class="pubs" data-pub-list>${DATA.pubs

            )
            .join("")}</ol>

        <section class="sec">

          <div class="tiles">${DATA.projects
            .map((p) => `<a class="tile" href="#"><span class="m"><span>${p.lang}</span><span>${p.year}</span></span><b>${p.name}</b><p>${p.desc}</p></a>`)
            .join("")}

          </div>

        <section class="sec">
          <div class="sec__head"><b>interests</b><span class="fill"></span><span>beyond the chalkboard</span></div>
          <div class="terms">${DATA.skills
            .map((s) => `<div class="terms__row"><span>${s.group.toUpperCase()}</span><div>${s.items.map((i) => `<em>${i}</em>`).join("")}</div></div>`)
            .join("")}</div>
        </section>

        <section class="sec" style="border-bottom:0">

          <div class="hello">

            <div class="cl">${DATA.links
              .map((l) => `<a href="${l.href}"><span>${l.label.toUpperCase()}</span><span>${l.kind === "email" || l.kind === "matrix" ? "assembled at runtime" : "open ↗"}</span></a>`)

        <footer class="foot"><span>NO FRAMEWORK, NO BUILD STEP</span><span>2026.09</span></footer>
      </div>
    `,
    boot: (root) => {
      const cv = root.querySelector("[data-field]");
      if (!cv) return;
      const ctx = cv.getContext("2d");
      const host = root.host;
      const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
      const STEP = 15;
      let W = 0, H = 0;

      const size = () => {
        W = Math.max(1, cv.offsetWidth || 1240);
        H = Math.max(1, cv.offsetHeight || 620);
        const dpr = Math.min(2, devicePixelRatio || 1);
        cv.width = W * dpr;
        cv.height = H * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      };

      /* Two coherent sources; cell brightness is the squared sum of their
         amplitudes, and the sign of that sum picks the fringe colour. */
      const draw = (t) => {
        const cs = getComputedStyle(host);
        const a1 = cs.getPropertyValue("--a1").trim();
        const a2 = cs.getPropertyValue("--a2").trim();
        const bg = cs.getPropertyValue("--bg").trim();
        ctx.fillStyle = bg;
        ctx.fillRect(0, 0, W, H);
        const k = 0.052, w = 1.1;
        const s1x = W * 0.34 + Math.cos(t * 0.17) * 90;
        const s1y = H * 0.44 + Math.sin(t * 0.23) * 60;
        const s2x = W * 0.68 + Math.cos(t * 0.13 + 2) * 90;
        const s2y = H * 0.5 + Math.sin(t * 0.19 + 1) * 60;
        for (let y = STEP / 2; y < H; y += STEP) {
          for (let x = STEP / 2; x < W; x += STEP) {
            const r1 = Math.hypot(x - s1x, y - s1y);
            const r2 = Math.hypot(x - s2x, y - s2y);
            const v = Math.cos(k * r1 - w * t) + Math.cos(k * r2 - w * t);
            const I = (v * v) / 4;
            if (I < 0.02) continue;
            const s = Math.max(1, I * (STEP - 4.5));
            ctx.globalAlpha = 0.14 + I * 0.5;
            ctx.fillStyle = v > 0 ? a1 : a2;
            ctx.fillRect(x - s / 2, y - s / 2, s, s);
          }
        }
        ctx.globalAlpha = 1;
      };

      size();
      if (still) {
        draw(0.8);
      } else {
        const t0 = performance.now();
        const loop = (now) => {
          draw((now - t0) / 1000);
          requestAnimationFrame(loop);
        };
        requestAnimationFrame(loop);
      }
      new ResizeObserver(() => size()).observe(cv);
    },
  });

  /* =====================================================================
     Review chrome behaviour
     ===================================================================== */

  const rail = document.getElementById("rail");
  const pickSeg = document.getElementById("pick-seg");
  const hint = document.getElementById("hint");
  const stages = new Map();
  let theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  let active = "A";

  /* Recent shows the three newest papers; All shows the list as delivered. */
  function wireFilter(root) {
    const group = root.querySelector("[data-filter-group]");
    const list = root.querySelector("[data-pub-list]");
    if (!group || !list) return;
    const rows = [...list.children];
    const apply = (mode) => rows.forEach((r, i) => r.classList.toggle("is-out", mode === "recent" && i > 2));
    group.addEventListener("click", (e) => {
      const btn = e.target.closest("[data-filter]");
      if (!btn) return;
      [...group.children].forEach((b) => b.setAttribute("aria-pressed", String(b === btn)));
      apply(btn.dataset.filter);
    });
    apply("recent");
  }

  function setTheme(next) {
    theme = next;
    stages.forEach((host) => host.setAttribute("data-t", next));
    document.querySelectorAll("#theme-seg button").forEach((b) =>
      b.setAttribute("aria-pressed", String(b.dataset.t === next))
    );
  }

  VARIANTS.forEach((v) => {
    const slot = document.createElement("article");
    slot.className = "slot";
    slot.dataset.slot = v.letter;
    slot.innerHTML =
      '<div class="slot__head"><span class="slot__letter">' +
      v.letter +
      '</span><div><div class="slot__name">' +
      v.name +
      '</div><div class="slot__blurb">' +
      v.blurb +
      "</div></div></div>" +
      '<dl class="notes">' +
      Object.entries(v.notes)
        .map((e) => '<div class="note"><dt>' + e[0] + "</dt><dd>" + e[1] + "</dd></div>")
        .join("") +
      "</dl>" +
      '<div class="frame"><div class="stage"></div></div>';

    rail.appendChild(slot);

    const stage = slot.querySelector(".stage");
    const root = stage.attachShadow({ mode: "open" });
    root.innerHTML = "<style>" + v.css + "</style>" + v.html();
    stage.setAttribute("data-t", theme);
    stages.set(v.letter, stage);

    wireFilter(root);
    const toggle = root.querySelector("[data-theme-toggle]");
    if (toggle) {
      const paint = () => (toggle.innerHTML = stage.getAttribute("data-t") === "dark" ? SUN : MOON);
      paint();
      toggle.addEventListener("click", () => {
        stage.setAttribute("data-t", stage.getAttribute("data-t") === "dark" ? "light" : "dark");
        paint();
      });
      new MutationObserver(paint).observe(stage, { attributes: true, attributeFilter: ["data-t"] });
    }
    if (v.boot) v.boot(root);

    const btn = document.createElement("button");
    btn.type = "button";
    btn.textContent = v.letter;
    btn.dataset.pick = v.letter;
    btn.setAttribute("aria-pressed", "false");
    pickSeg.appendChild(btn);
  });

  function fitZoom() {
    stages.forEach((stage) => {
      const w = stage.parentElement.clientWidth;
      stage.style.zoom = (w / 1240).toFixed(4);
    });
  }

  function setView(view, letter) {
    document.body.dataset.view = view;
    if (letter) active = letter;
    document.querySelectorAll(".slot").forEach((s) => {
      s.hidden = view === "focus" && s.dataset.slot !== active;
    });
    document.querySelectorAll("#view-seg button").forEach((b) =>
      b.setAttribute("aria-pressed", String(b.dataset.view === view))
    );
    pickSeg.querySelectorAll("button").forEach((b) =>
      b.setAttribute("aria-pressed", String(view === "focus" && b.dataset.pick === active))
    );
    hint.textContent =
      view === "focus"
        ? "Full size. Use ← and → to step between designs, or go back to All five."
        : "Each panel scrolls on its own. Pick a letter to blow it up full size.";
    requestAnimationFrame(fitZoom);
  }

  document.getElementById("view-seg").addEventListener("click", (e) => {
    const b = e.target.closest("button");
    if (b) setView(b.dataset.view);
  });
  pickSeg.addEventListener("click", (e) => {
    const b = e.target.closest("button");
    if (b) setView("focus", b.dataset.pick);
  });
  document.getElementById("theme-seg").addEventListener("click", (e) => {
    const b = e.target.closest("button");
    if (b) setTheme(b.dataset.t);
  });
  rail.addEventListener("click", (e) => {
    if (document.body.dataset.view === "focus") return;
    const head = e.target.closest(".slot__head");
    if (head) setView("focus", head.closest(".slot").dataset.slot);
  });
  addEventListener("keydown", (e) => {
    if (document.body.dataset.view !== "focus") return;
    const order = VARIANTS.map((v) => v.letter);
    const i = order.indexOf(active);
    if (e.key === "ArrowRight") setView("focus", order[(i + 1) % order.length]);
    if (e.key === "ArrowLeft") setView("focus", order[(i - 1 + order.length) % order.length]);
    if (e.key === "Escape") setView("rail");
  });
  addEventListener("resize", fitZoom);

  setTheme(theme);
  setView("rail");
</script>
