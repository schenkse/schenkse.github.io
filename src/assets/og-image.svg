  <text x="98" y="438" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="92" font-weight="700" letter-spacing="-2" fill="#ece8f5">Sebastian Schenk</text>
  <text x="100" y="506" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="26" fill="#968caa">schenkse.github.io</text>
