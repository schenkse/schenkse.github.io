    <rect x="47" y="47" width="66" height="66" rx="6"/>
    <line x1="20" y1="80" x2="47" y2="80" stroke-linecap="round"/>
    <line x1="113" y1="80" x2="140" y2="80" stroke-linecap="round"/>
    <text x="80" y="95" text-anchor="middle" font-family="system-ui, sans-serif" font-size="38" font-weight="500" fill="#b69cff" stroke="none">S</text>
