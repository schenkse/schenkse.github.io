<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Sebastian Schenk — Theoretical physicist">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d0a17"/>
      <stop offset="100%" stop-color="#181425"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="8" fill="#b69cff"/>

  <!-- Brandmark (S in PCB pad with traces), scaled from the 0 0 160 160 master -->
