<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Sebastian Schenk">
  <!-- The page's two inks and nothing else: a near-black tile in the text
       colour, carrying an S in the page background. The ground is dark because
       a light one vanishes into a light tab strip. -->
  <rect width="64" height="64" rx="12" fill="#1a1a19"/>
  <text x="32" y="45" text-anchor="middle"
        font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="42" font-weight="700" letter-spacing="-1" fill="#fdfdfc">S</text>
</svg>
